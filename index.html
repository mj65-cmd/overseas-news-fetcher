<script>
const REPO = 'mj65-cmd/overseas-news-fetcher';
const BRANCH = 'main';
let articles = [];
let currentArticle = null;
let currentStyle = 'shortvideo';

  summary: '把下面这篇文章压缩成3句话的超精简摘要。\n\n严格要求：\n1. 第一句说核心事件\n2. 第二句说关键数据/方法\n3. 第三句说对普通人的意义\n4. 三句话之间空一行\n5. 不要用任何markdown符号、星号、井号，直接写纯文本'

// 初始化
window.onload = function() {
  const savedKey = localStorage.getItem('groq_key');
  if (savedKey) document.getElementById('groqKey').value = savedKey;
  loadModels();
  refreshArticles();
  
  // 风格按钮
  document.querySelectorAll('.style-btn').forEach(btn => {
    btn.onclick = function() {
      document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      currentStyle = this.dataset.style;
    };
  });
};

function saveKey() {
  const key = document.getElementById('groqKey').value.trim();
  localStorage.setItem('groq_key', key);
  alert('Key 已保存到本地浏览器');
  loadModels();
}

async function loadModels() {
  const key = document.getElementById('groqKey').value.trim() || localStorage.getItem('groq_key');
  if (!key) return;
  try {
    const resp = await fetch('https://api.groq.com/openai/v1/models', {
      headers: { 'Authorization': 'Bearer ' + key }
    });
    if (resp.ok) {
      const data = await resp.json();
      const select = document.getElementById('modelSelect');
      select.innerHTML = '<option value="auto">自动选择（推荐）</option>';
      data.data.forEach(m => {
        if (!m.id.includes('guard') && !m.id.includes('safeguard') && !m.id.includes('whisper')) {
          const opt = document.createElement('option');
          opt.value = m.id;
          opt.textContent = m.id;
          select.appendChild(opt);
        }
      });
    }
  } catch(e) { console.log('load models error', e); }
}


function formatChineseTime(dateStr) {
  if (!dateStr) return '未知';
  const date = new Date(dateStr);
  if (isNaN(date.getTime())) return '未知';
  const now = new Date();
  const diffMs = now - date;
  if (diffMs < 0) return '刚刚';
  const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
  const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
  const hours = String(date.getHours()).padStart(2, '0');
  const mins = String(date.getMinutes()).padStart(2, '0');
  
  if (diffHours < 1) return '刚刚';
  if (diffHours < 24) return '今天 ' + hours + ':' + mins;
  if (diffDays === 1) return '昨天 ' + hours + ':' + mins;
  if (diffDays === 2) return '前天 ' + hours + ':' + mins;
  if (diffDays < 7) return diffDays + '天前';
  return (date.getMonth()+1) + '月' + date.getDate() + '日';
}

async function refreshArticles() {
  const listEl = document.getElementById('articleList');
  const btn = document.getElementById('refreshBtn');
  const oldCount = articles.length;
  btn.disabled = true;
  btn.textContent = '⏳ 刷新中...';
  listEl.innerHTML = '<div class="loading">正在加载最新文章...</div>';
  try {
    // 优先读索引文件（有准确时间）
    let indexResp = await fetch(`https://raw.githubusercontent.com/${REPO}/${BRANCH}/output/articles/index.json?t=${Date.now()}`);
    if (indexResp.ok) {
      articles = await indexResp.json();
    } else {
      //  fallback: 读目录列表
      const resp = await fetch(`https://api.github.com/repos/${REPO}/contents/output/articles?ref=${BRANCH}`);
      const data = await resp.json();
      articles = data.filter(f => f.name.endsWith('.md') && f.name !== 'processed.txt').map(f => ({
        name: f.name,
        title: f.name.replace(/_/g,' ').replace('.md',''),
        size: f.size,
        created_at: new Date().toISOString()
      }));
    }
    
    if (articles.length === 0) {
      listEl.innerHTML = '<div style="padding:20px;text-align:center;color:#999;font-size:13px;">暂无文章</div>';
      btn.textContent = '🔄 刷新文章';
      btn.disabled = false;
      return;
    }
    
    const now = Date.now();
    listEl.innerHTML = articles.map((a, i) => {
      const articleTime = new Date(a.created_at).getTime();
      const isNew = (now - articleTime) < 24 * 3600 * 1000;
      const dateStr = formatChineseTime(a.created_at);
      const newBadge = isNew ? ' <span style="color:#667eea;font-weight:600;">NEW</span>' : '';
      const displayTitle = a.title || a.name.replace(/_/g,' ').replace('.md','');
      return `
      <div class="article-item ${isNew ? 'new' : ''}" onclick="selectArticle(${i})" id="item-${i}">
        <div class="title">${displayTitle.substring(0,60)}${displayTitle.length>60?'...':''}${newBadge}</div>
        <div class="meta">${(a.size/1024).toFixed(1)} KB</div>
        <div class="date">${dateStr}</div>
      </div>`;
    }).join('');
    
    const newCount = articles.length - oldCount;
    if (newCount > 0) {
      btn.textContent = `✅ 已更新 (+${newCount}篇)`;
    } else if (oldCount > 0) {
      btn.textContent = `✅ 已是最新 (${articles.length}篇)`;
    } else {
      btn.textContent = `✅ 加载完成 (${articles.length}篇)`;
    }
    setTimeout(() => { btn.textContent = '🔄 刷新文章'; btn.disabled = false; }, 2500);
  } catch(e) {
    listEl.innerHTML = '<div style="padding:20px;text-align:center;color:red;font-size:13px;">加载失败: ' + e.message + '</div>';
    btn.textContent = '❌ 刷新失败';
    setTimeout(() => { btn.textContent = '🔄 刷新文章'; btn.disabled = false; }, 2000);
  }
}

async function selectArticle(index) {
  document.querySelectorAll('.article-item').forEach(el => el.classList.remove('active'));
  document.getElementById('item-' + index).classList.add('active');
  
  currentArticle = articles[index];
  const contentEl = document.getElementById('articleContent');
  contentEl.innerHTML = '<div class="loading">加载文章内容...</div>';
  
  try {
    const url = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/output/articles/${encodeURIComponent(articles[index].name)}?t=${Date.now()}`;
    const resp = await fetch(url);
    const text = await resp.text();
    contentEl.innerHTML = markdownToHtml(text);
    document.getElementById('rewriteBtn').disabled = false;
    document.getElementById('rewriteBtn').textContent = '开始改写';
  } catch(e) {
    contentEl.innerHTML = '<div class="empty-state">加载失败</div>';
  }
}

function markdownToHtml(md) {
  let html = md
    .replace(/^### (.*$)/gm, '<h3>$1</h3>')
    .replace(/^## (.*$)/gm, '<h2>$1</h2>')
    .replace(/^# (.*$)/gm, '<h1>$1</h1>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/`(.*?)`/g, '<code>$1</code>')
    .replace(/^- (.*$)/gm, '<li>$1</li>')
    .replace(/^\d+\. (.*$)/gm, '<li>$1</li>')
    .replace(/\n\n/g, '</p><p>')
    .replace(/\n/g, '<br>');
  
  // 包裹列表
  html = html.replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>');
  html = html.replace(/<\/ul><ul>/g, '');
  
  // 处理表格（简单处理）
  if (html.includes('|')) {
    const lines = md.split('\n');
    let tableHtml = '';
    let inTable = false;
    let tableRows = [];
    for (let line of lines) {
      if (line.trim().startsWith('|') && line.includes('|')) {
        inTable = true;
        tableRows.push(line);
      } else if (inTable) {
        tableHtml += renderTable(tableRows);
        tableRows = [];
        inTable = false;
      }
    }
    if (tableRows.length) tableHtml += renderTable(tableRows);
    if (tableHtml) {
      html = html.replace(/<p>[\s\S]*?<\/p>/g, function(match) {
        if (match.includes('|')) return tableHtml;
        return match;
      });
    }
  }
  
  return '<p>' + html + '</p>';
}

function renderTable(rows) {
  if (rows.length < 2) return '';
  const headers = rows[0].split('|').filter(c => c.trim());
  const body = rows.slice(2).map(r => r.split('|').filter(c => c.trim()));
  let html = '<table><tr>';
  headers.forEach(h => html += `<th>${h.trim()}</th>`);
  html += '</tr>';
  body.forEach(row => {
    html += '<tr>';
    row.forEach(c => html += `<td>${c.trim()}</td>`);
    html += '</tr>';
  });
  html += '</table>';
  return html;
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  if (tab === 'original') {
    document.querySelectorAll('.tab')[0].classList.add('active');
    document.getElementById('originalTab').style.display = 'block';
    document.getElementById('rewriteTab').style.display = 'none';
  } else {
    document.querySelectorAll('.tab')[1].classList.add('active');
    document.getElementById('originalTab').style.display = 'none';
    document.getElementById('rewriteTab').style.display = 'block';
  }
}


function cleanText(text) {
  return text
    .replace(/\r\n/g, '\n')
    .replace(/\r/g, '\n')
    .replace(/[\u200B-\u200F\u2028-\u202F\uFEFF]/g, '')
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F-\u009F]/g, '')
    .replace(/^[ \t]+/gm, '')
    .replace(/[ \t]+$/gm, '')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

async function doRewrite() {
  const key = document.getElementById('groqKey').value.trim() || localStorage.getItem('groq_key');
  if (!key) { alert('请先在左侧填写并保存 Groq API Key'); return; }
  if (!currentArticle) { alert('请先选择一篇文章'); return; }
  
  const btn = document.getElementById('rewriteBtn');
  const output = document.getElementById('rewriteOutput');
  btn.disabled = true;
  btn.textContent = '改写中...';
  output.classList.add('show');
  output.textContent = '正在调用 AI 改写，请稍候...';
  
  try {
    const resp = await fetch(`https://raw.githubusercontent.com/${REPO}/${BRANCH}/output/articles/${encodeURIComponent(currentArticle.name)}?t=${Date.now()}`);
    const originalText = await resp.text();
    
    // 获取可用模型列表，按优先级排序
    const modelsResp = await fetch('https://api.groq.com/openai/v1/models', {
      headers: { 'Authorization': 'Bearer ' + key }
    });
    const modelsData = await modelsResp.json();
    const available = modelsData.data.map(m => m.id);
    const priority = ['openai/gpt-oss-20b', 'openai/gpt-oss-120b', 'groq/compound', 'groq/compound-mini', 'allam-2-7b'];
    const modelList = priority.filter(m => available.includes(m));
    if (modelList.length === 0) {
      modelList.push(available.find(m => !m.includes('guard') && !m.includes('whisper') && !m.includes('canopylabs') && !m.includes('orpheus')) || 'mixtral-8x7b-32768');
    }
    
    const systemPrompt = STYLE_PROMPTS[currentStyle];
    let lastError = '';
    
    // 逐个模型尝试，遇到限流自动切换
    for (let i = 0; i < modelList.length; i++) {
      const model = modelList[i];
      output.textContent = `正在用 ${model} 改写... (${i+1}/${modelList.length})`;
      
      try {
        const groqResp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + key,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: model,
            temperature: 0.7,
            messages: [
              { role: 'system', content: systemPrompt },
              { role: 'user', content: '原文：\n' + originalText.substring(0, 15000) }
            ]
          })
        });
        
        if (groqResp.status === 429) {
          lastError = '模型 ' + model + ' 限流，自动切换下一个...';
          output.textContent = lastError;
          await new Promise(r => setTimeout(r, 2000));
          continue;
        }
        
        if (!groqResp.ok) {
          const err = await groqResp.text();
          lastError = '改写失败 (' + model + '): ' + err.substring(0, 200);
          continue;
        }
        
        const data = await groqResp.json();
        output.textContent = cleanText(data.choices[0].message.content);
        return;
      } catch(e) {
        lastError = '模型 ' + model + ' 出错: ' + e.message;
        continue;
      }
    }
    
    output.textContent = '所有模型都暂时不可用，请稍后再试。最后错误: ' + lastError;
    
  } catch(e) {
    output.textContent = '改写出错: ' + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = '开始改写';
  }
}

function copyRewrite() {
  const text = cleanText(document.getElementById('rewriteOutput').textContent);
  if (!text || text.includes('正在调用') || text.includes('失败') || text.includes('出错')) {
    alert('没有可复制的内容');
    return;
  }
  navigator.clipboard.writeText(text).then(() => {
    alert('已复制到剪贴板');
  });
}
</script>
