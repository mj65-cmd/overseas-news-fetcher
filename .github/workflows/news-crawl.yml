name: News-Crawl-Job
on:
  workflow_dispatch:
    inputs:
      source_type:
        description: '抓取类型: gzh(公众号实操干货) / tt(今日头条热点资讯)'
        required: true
        default: 'gzh'
        type: choice
        options:
          - gzh
          - tt

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install feedparser requests
      - name: Run
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          SOURCE_TYPE: ${{ github.event.inputs.source_type }}
        run: python scripts/fetch_and_extract.py
      - name: Save
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "auto: update news articles" && git pull --rebase && git push)
